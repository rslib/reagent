[package]
name = "reagent-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reagent-protocol.workspace = true
reagent-store.workspace = true
reagent-ai.workspace = true
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-width = { version = "0.2.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros", "fs", "process", "signal"] }
libc = { version = "0.2.191", default-features = false }
[lints]
workspace = true

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
tempfile = "3.27.0"
vt100 = { version = "0.18.1", default-features = false }
