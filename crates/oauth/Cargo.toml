[package]
name = "reagent-oauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []

[lints]
workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
reagent-config.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["raw_value", "std"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
webpki-root-certs = { version = "1.0.9", default-features = false }
