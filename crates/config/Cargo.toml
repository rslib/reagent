[package]
name = "reagent-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reagent-util.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
gungraun = "0.20.0"
tempfile = "3.27.0"

[[bench]]
name = "instructions"
harness = false
