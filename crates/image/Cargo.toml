[package]
name = "reagent-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
heic-decoder = { version = "=0.1.1", optional = true }
image-webp = { version = "0.2", default-features = false }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
png = { version = "0.18", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"], optional = true }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
gungraun = "0.20.0"

[features]
default = ["heic", "tiff"]
heic = ["dep:heic-decoder"]
tiff = ["dep:tiff"]

[[bench]]
name = "instructions"
harness = false
