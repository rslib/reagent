[package]
name = "reagent-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = ["reagent-oauth/testing"]

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
memchr = "2.8.3"
reagent-config.workspace = true
reagent-oauth.workspace = true
reagent-store.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["raw_value", "std"] }

[lints]
workspace = true

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
divan = { version = "0.1.21", default-features = false }
gungraun = "0.20.0"
reagent-oauth = { workspace = true, features = ["testing"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "io-util", "sync", "time"] }

[[bench]]
name = "providers"
harness = false

[[test]]
name = "allocs"
required-features = ["testing"]

[[bench]]
name = "instructions"
harness = false
