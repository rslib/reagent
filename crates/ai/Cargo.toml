[package]
name = "reagent-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["raw_value", "std"] }
webpki-root-certs = { version = "1.0.9", default-features = false }

[lints]
workspace = true

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
divan = { version = "0.1.21", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "net", "io-util", "sync", "time"] }

[[bench]]
name = "providers"
harness = false

[[test]]
name = "allocs"
required-features = ["testing"]
