[package]
name = "reagent-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
memchr = "2.8.3"
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
reagent-agent.workspace = true
reagent-ai.workspace = true
reagent-config.workspace = true
reagent-util.workspace = true
regex-lite = "0.1.9"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false, features = ["fs", "io-util", "process", "time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
[lints]
workspace = true

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
gungraun = "0.20.0"
tempfile = { version = "3.27.0", default-features = false }

[[bench]]
name = "instructions"
harness = false
