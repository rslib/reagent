[package]
name = "reagent-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "user"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["fs", "io-util", "macros", "sync", "time"] }

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "process", "sync", "test-util", "time"] }
