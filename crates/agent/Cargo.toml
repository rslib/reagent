[package]
name = "reagent-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reagent-ai.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time", "sync", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }

[dev-dependencies]
reagent-ai = { workspace = true, features = ["testing"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["test-util"] }

[lints]
workspace = true
