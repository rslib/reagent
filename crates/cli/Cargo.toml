[package]
name = "reagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reagent"
path = "src/main.rs"

[features]
testing = ["reagent-ai/testing", "dep:tempfile"]

[dependencies]
reagent-ai.workspace = true
reagent-agent.workspace = true
reagent-tools.workspace = true
reagent-script.workspace = true
reagent-mcp.workspace = true
reagent-tui.workspace = true
lexopt = { version = "0.3.2", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["signal", "io-util", "io-std", "time", "rt", "macros", "sync", "net", "process"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
tempfile = { version = "3.27.0", default-features = false, optional = true }
reagent-config.workspace = true
reagent-store.workspace = true
reagent-util.workspace = true
reagent-sandbox.workspace = true
reagent-oauth.workspace = true

[dev-dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
gungraun = "0.20.0"
png = { version = "0.18", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "process", "io-std", "io-util", "time", "sync"] }

[lints]
workspace = true

[[bench]]
name = "instructions"
harness = false
required-features = ["testing"]
