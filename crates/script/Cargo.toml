[package]
name = "reagent-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reagent-agent.workspace = true
reagent-ai.workspace = true
reagent-tools.workspace = true
rquickjs = { version = "0.14.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
[lints]
workspace = true

[dev-dependencies]
dhat = { version = "0.3.3", default-features = false }
reagent-config.workspace = true
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["test-util", "rt", "macros"] }
