[package]
name = "reagent-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
