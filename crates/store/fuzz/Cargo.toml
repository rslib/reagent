[package]
name = "reagent-store-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
reagent-store = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# Its own workspace: the crate is not a member of the reagent workspace.
[workspace]
