[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
reagent-ai = { path = "crates/ai" }
reagent-agent = { path = "crates/agent" }
reagent-tools = { path = "crates/tools" }
reagent-config = { path = "crates/config" }
reagent-oauth = { path = "crates/oauth" }
reagent-util = { path = "crates/util" }
reagent-sandbox = { path = "crates/sandbox" }
reagent-script = { path = "crates/script" }
reagent-mcp = { path = "crates/mcp" }
reagent-tui = { path = "crates/tui" }
reagent-store = { path = "crates/store" }
reagent-protocol = { path = "crates/protocol" }
reagent-image = { path = "crates/image" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
inefficient_to_string = "warn"
unnecessary_to_owned = "warn"
format_collect = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Callgrind finds a bench function by its symbol, so benches keep symbols
# that the release profile strips; without them every count reads 0.
[profile.bench]
strip = false
debug = "line-tables-only"

# Size-first build for footprint measurements and the eval container.
[profile.min]
inherits = "release"
opt-level = "z"
panic = "abort"

# The crates that do heavy CPU work keep "s": "z" for them doubled the CPU of a
# 4000x3000 JPEG read (96 to 193 ms) and slowed a grep by half on macOS, while
# this split kept both and the binary still lost 895 KB (6,050,480 to
# 5,154,976 bytes).
[profile.min.package.crc32c]
opt-level = "s"
[profile.min.package.crc32fast]
opt-level = "s"
[profile.min.package.fdeflate]
opt-level = "s"
[profile.min.package.gif]
opt-level = "s"
[profile.min.package.heic-decoder]
opt-level = "s"
[profile.min.package.image-webp]
opt-level = "s"
[profile.min.package.jpeg-encoder]
opt-level = "s"
[profile.min.package.memchr]
opt-level = "s"
[profile.min.package.miniz_oxide]
opt-level = "s"
[profile.min.package.png]
opt-level = "s"
[profile.min.package.reagent-image]
opt-level = "s"
[profile.min.package.reagent-tools]
opt-level = "s"
[profile.min.package.regex-lite]
opt-level = "s"
[profile.min.package.serde_json]
opt-level = "s"
[profile.min.package.simd-adler32]
opt-level = "s"
[profile.min.package.tiff]
opt-level = "s"
[profile.min.package.weezl]
opt-level = "s"
[profile.min.package.zstd]
opt-level = "s"
[profile.min.package.zstd-safe]
opt-level = "s"
[profile.min.package.zstd-sys]
opt-level = "s"
[profile.min.package.zune-core]
opt-level = "s"
[profile.min.package.zune-jpeg]
opt-level = "s"
