[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
reagent-ai = { path = "crates/ai" }
reagent-agent = { path = "crates/agent" }
reagent-tools = { path = "crates/tools" }
reagent-script = { path = "crates/script" }
reagent-mcp = { path = "crates/mcp" }
reagent-tui = { path = "crates/tui" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
inefficient_to_string = "warn"
unnecessary_to_owned = "warn"
format_collect = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Size-first build for footprint measurements and the eval container.
[profile.min]
inherits = "release"
opt-level = "s"
panic = "abort"
